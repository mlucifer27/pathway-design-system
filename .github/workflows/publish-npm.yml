name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Validate package
        run: node scripts/validate-before-publish.mjs

      - name: Check if version is already published
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@pathway/design-system@${VERSION}" version 2>/dev/null | grep -Fxq "${VERSION}"; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: @pathway/design-system@${VERSION} is already on npm. Bump version in package.json to release again."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish @pathway/design-system@${VERSION}"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Already published (no-op)
        if: steps.version.outputs.should_publish != 'true'
        run: echo "No publish needed for version ${{ steps.version.outputs.package_version }}."
