name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Require NPM_TOKEN secret
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Missing repository secret NPM_TOKEN. Add an npm Automation token under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@pathway-sg"
          always-auth: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run validate

      - name: Check if version is already published
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@pathway-sg/design-system@${VERSION}" version 2>/dev/null | grep -Fxq "${VERSION}"; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: @pathway-sg/design-system@${VERSION} is already on npm. Bump version in package.json to release again."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish @pathway-sg/design-system@${VERSION}"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Already published (no-op)
        if: steps.version.outputs.should_publish != 'true'
        run: echo "No publish needed for version ${{ steps.version.outputs.package_version }}."
